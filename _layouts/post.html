---
layout: default
---

<article class="article-container">

  <header class="article-header">

    {% if page.categories %}
      <div class="article-category">
        {{ page.categories | first }}
      </div>
    {% endif %}

    <h1>{{ page.title }}</h1>

    <div class="article-meta">
      Published on {{ page.date | date: "%d %B %Y" }}
    </div>

  </header>


  <div class="article-content">

    {{ content }}

  </div>

</article>
